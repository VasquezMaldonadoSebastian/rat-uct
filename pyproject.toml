[project]
name = "rat-uct"
version = "0.1.0"
description = "Registro de Actividades de Tratamiento — Universidad Católica de Temuco"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "duckdb>=1.0.0",
    "pydantic>=2.0.0",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["B008", "B905"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
