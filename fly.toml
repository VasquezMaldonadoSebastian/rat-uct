# ─── fly.toml — RAT UCT deploy config ────────────────────────────────────────

app = "rat-uct"

[build]
  image = "rat-uct:latest"

[env]
  PORT = "8080"
  DB_PATH = "/data/rat_uct.db"

[[services]]
  protocol = "tcp"
  internal_port = 8080

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.http_checks]]
    interval = "15s"
    timeout = "5s"
    method = "get"
    path = "/api/actividades/total"

[mounts]
  source = "rat_uct_data"
  destination = "/data"
  initial_size = "1GB"
